name: Clear merge conflicts

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: clear-conflicts
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Merge main into a conflicting pull request and keep both sides
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK: npx tsc -b --pretty false
        run: node .github/scripts/clear-conflicts.mjs
